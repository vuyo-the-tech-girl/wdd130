<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Get in touch us about our white water rafting company Find our adress, phone number and email.">
    <meta name="author" content="Vuyo Faleni">
    <title>Contact Us | White Water Rafting</title> 
    <link rel="stylesheet" href="styles/rafting.css">  
</head>
<body>
    <header>
        <img src="images/rafting-companylogo.jpg" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>        
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <section class="company-info">
            <h2>Our Details</h2>
            <p>Adresss: 789 Rafting Lane, Cape Town</p>
            <p>Phone: 123-654-7890</p>
            <p>Email: info@whitewaterrafting.com</p>
            <iframe src="https"></iframe>
        </section>
        <section class="employee-profiles">
            <h2>Meet the Team</h2>
            <figure>
                <img src="" alt="John">
                <figcaption>John - CEO</figcaption>
            </figure>
            <figure>
                <img src="" alt="Jane">
                <figcaption>Jane - Guide</figcaption>
            </figure>
            <figure>
                <img src="" alt="Bob">
                <figcaption>Bob - Operations</figcaption>
            </figure>
        </section>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>
            <label>Purpose:</label><br>
            <input type="radio" id="general" name="purpose" value="General Inquiry">
            <label for="general">General Inquiry</label><br>
            <input type="radio" id="reservation" name="purpose" value="Reservation Question">
            <label for="reservation">Reservation Question</label><br>
            <input type="radio" id="website" name="purpose" value="Website Suggestion">
            <label for="website">Website Suggestion</label><br>
            <label for="message">Message:</label>
            <textarea id="message" name="message"></textarea><br>
            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe">Please subscribe me to the monthly newsletter</label><br>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting Co. | Vuyo Faleni</p>
        <nav class="socialmeadia">
            <a href="https://facebookcom">
                <img src="images/facebook.jpg" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-square.jpg" alt="Instagram Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.jpg" alt="LinkedIn Icon">
            </a>
        </nav>
    </footer>
</body>
</html>
