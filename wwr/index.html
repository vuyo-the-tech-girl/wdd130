<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scaled=1.0">
        <title>White Water Rafting Company</title>
        <link rel="stylesheet" href="styles/rafting.css">
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="hero">
                <img src="images/heroimage.jpg" alt="White Water Rafting">
                <hi>Experience the Thrill of White Water Rafting</hi>
            </section>
            <section class="newsletter">
                <h2>Stay Updated!</h2>
                <form>
                    <input type="text" name="name" placeholder="Name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <button type="submit">Sign Up</button>
                </form>
            </section>
            <section class="grid-container">
                <div class="grid-item">
                    <img src="images/rafting17_600.jpg" alt="Rafting Team 1">
                    <p>Explore the best white water rafting sports in the region!</p>
                </div>
                <div class="grid-item">
                    <img src="images/rafting18_600.jpg" alt="Rafting Team 2">
                    <p>Our expert guides ensure a safe and thrilling experience.</p>
                </div>
            </section>
            <section class="call-to-action">
                <a href="trips.html" class="cta-button">Explore Our Trips</a>
            </section>
        </main>
        <footer>
        <p>&copy; 2026 White Water Rafting Company</p>
        <ul class="social-icons">
            <li><a href="instagram.com"><img src="images/instagram-square.jpg" alt="Instagram"></a></li>
            <li><a href="linkedin.com"><img src="images/linkedin-square.jpg" alt="LinkedIn"></a></li>
            <li><a href="facebook.com"><img src="images/facebook.jpg" alt="Facebook"></a></li>
        </ul>
    </footer>
